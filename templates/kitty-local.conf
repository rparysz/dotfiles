# Machine-specific kitty overrides. Not tracked by git.
#
# The background image lives here rather than in kitty.conf because the
# wallpapers themselves are not in the repo. Download one and register it:
#
#   kitty-bg --add ~/Pictures/foo.jpg
#
# which converts it to WebP, stores it in ~/.config/kitty/wallpapers/, and
# writes the line below for you.
#
# background_image wallpapers/foo.webp
#
# Other per-machine settings, e.g. a larger font on a HiDPI panel:
# font_size 13.0
