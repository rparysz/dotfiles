# kitty — portable across machines. Nothing here uses an absolute path.
# Machine-specific overrides go in local.conf (gitignored, see bottom).

# ── Font ──────────────────────────────────────────────────────────────
# Install: https://github.com/ryanoasis/nerd-fonts/releases (JetBrainsMono.zip)
# Without a Nerd Font every icon in LazyVim renders as a box.
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
font_size        11.0
# JetBrainsMono ships programming ligatures: != is drawn as one glyph, and so
# are -> => === and friends. `always` renders every character separately.
# Use `cursor` instead to keep the ligatures but break the one under the cursor.
disable_ligatures always

# ── Background image ──────────────────────────────────────────────────
# The image itself is machine-local — set `background_image` in local.conf,
# not here. Wallpapers are downloaded per machine with `kitty-bg --add`,
# which writes the setting to local.conf for you.
# Relative paths resolve against the kitty config dir, so a value like
# `wallpapers/foo.webp` finds ~/.config/kitty/wallpapers/foo.webp.
background_image_layout scaled
# 0.0 = image at full strength, 1.0 = fully hidden behind the bg colour.
# Raise for readability. ctrl+alt+= / ctrl+alt+- adjust live.
background_tint         0.95
background_tint_gaps    1.0

# For the image to be visible, nvim and tmux must not paint over it:
#   nvim  -> colorscheme with transparent = true
#   tmux  -> window-style / window-active-style / status-style = bg=default

# Desktop transparency instead of (or on top of) the image:
# background_opacity         0.9
# dynamic_background_opacity yes

# ── Keybindings ───────────────────────────────────────────────────────
# ctrl+shift+f11  fullscreen        (kitty default)
# ctrl+shift+f10  maximise          (kitty default)
# ctrl+shift+f5   reload config     (kitty default)
map ctrl+alt+equal launch --type=background kitty-tint +0.02
map ctrl+alt+minus launch --type=background kitty-tint -0.02
map ctrl+alt+0     launch --type=background kitty-tint 0.92

# ── Misc ──────────────────────────────────────────────────────────────
enable_audio_bell no
scrollback_lines  10000
window_padding_width 4
confirm_os_window_close 0

# ── Machine-specific overrides ────────────────────────────────────────
# Not tracked by git. Create it for anything that differs per machine
# (font size on a HiDPI panel, a different wallpaper, remote control).
include local.conf
