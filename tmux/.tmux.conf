# ── Plugins (TPM) ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'toddyamakawa/tmux-prefixless'

# ── Prefix: Ctrl-a (instead of Ctrl-b) ─────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # C-a C-a sends a literal Ctrl-a

# ── Split equalizing for the (prefix-based) default keys ────────
bind % split-window -h \; select-layout even-horizontal
bind '"' split-window -v \; select-layout even-vertical
bind = select-layout tiled   # snap all panes into an even grid

# ── Init TPM ───────────────────────────────────────────────────
# tmux-prefixless makes 'prefixless' the default key-table and binds
# its own M-* keys. Everything below MUST come AFTER this line, or the
# plugin overwrites it at load time.
run '~/.tmux/plugins/tpm/tpm'

# ── My overrides (must follow TPM) ─────────────────────────────

# Pane navigation: Alt + i/j/k/l like arrows
#   i = up     j = left     k = down     l = right
bind -T prefixless M-i select-pane -U
bind -T prefixless M-j select-pane -L
bind -T prefixless M-k select-pane -D
bind -T prefixless M-l select-pane -R

# M-i used to exit prefixless mode; that toggle now lives on M-o (both ways)
bind -T root       M-o set-option -gs key-table prefixless
bind -T prefixless M-o set-option -gs key-table root

# Splits always 50/50 (drop the plugin's -f full-span on the capitals)
#   v = left/right split   s = top/bottom split   (caps = same here)
bind -T prefixless M-v split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind -T prefixless M-V split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind -T prefixless M-s split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
bind -T prefixless M-S split-window -v -c "#{pane_current_path}" \; select-layout even-vertical

# ── Prefix splits: | = side-by-side, - = stacked ───────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"  # | without shift

# Reach the prefix table from prefixless mode too
bind -T prefixless C-a set-option -gs key-table prefix

# ── Status bar: powerline style ────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc,xterm-256color:Tc,xterm-kitty:Tc"

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-position bottom
set -g status-style "bg=default,fg=colour248"

set -g status-left-length 40
set -g status-left "#[bg=colour109,fg=colour234,bold] #S #{?#{==:#{active_window_index},1},#[fg=colour109#,bg=colour215#,nobold],#[fg=colour109#,bg=colour240#,nobold]}"

set -g status-right-length 80
set -g status-right "#[bg=colour234,fg=colour238]#[bg=colour238,fg=colour250] %H:%M #[bg=colour238,fg=colour109]#[bg=colour109,fg=colour234,bold] #h "

set -g window-status-separator ""
set -g window-status-format "#[bg=colour240,fg=colour252] #I #W#{?window_zoomed_flag, Z,} #{?window_end_flag,#[fg=colour240#,bg=colour234],#{?#{==:#{e|+:#{window_index},1},#{active_window_index}},#[fg=colour240#,bg=colour215],#[fg=colour248#,bg=colour240]}}"
set -g window-status-current-format "#[bg=colour215,fg=colour234,bold] #I #W#{?window_zoomed_flag, Z,} #{?window_end_flag,#[fg=colour215#,bg=colour234#,nobold],#[fg=colour215#,bg=colour240#,nobold]}"

set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour109"
set -g message-style "bg=colour215,fg=colour234,bold"

# ── Index windows/panes from 1 ─────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Transparency: let kitty's background image show through ───────────
set -g window-style        'bg=default'
set -g window-active-style 'bg=default'
# Required for the kitty graphics protocol (inline images) through tmux
set -g allow-passthrough on
